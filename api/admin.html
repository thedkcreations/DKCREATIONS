<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DK Creations — Admin Orders</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{--maroon:#6B1A2A;--maroon-deep:#4A0F1C;--gold:#C9960C;--cream:#FDF6EC;--cream-dark:#F5E9D4;--text:#2C1A10;--text-soft:#6B4C35;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text);padding:2rem 1.2rem;}
  h1{font-family:'Cormorant Garamond',serif;color:var(--maroon-deep);margin-bottom:1.5rem;text-align:center;}
  .login-box{max-width:340px;margin:4rem auto;background:white;border-radius:10px;padding:2rem;box-shadow:0 4px 20px rgba(107,26,42,0.1);text-align:center;}
  .login-box input{width:100%;padding:0.7rem 0.9rem;border:2px solid var(--cream-dark);border-radius:6px;font-size:0.95rem;margin:1rem 0;}
  .login-box button, .refresh-btn{background:var(--maroon);color:white;border:none;padding:0.7rem 1.4rem;border-radius:6px;font-weight:700;cursor:pointer;font-size:0.9rem;}
  .login-box button:hover, .refresh-btn:hover{background:var(--maroon-deep);}
  table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(107,26,42,0.07);}
  th,td{padding:0.7rem 0.8rem;text-align:left;font-size:0.85rem;border-bottom:1px solid var(--cream-dark);}
  th{background:var(--maroon-deep);color:white;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;}
  tr:hover{background:var(--cream);}
  select{padding:0.35rem 0.5rem;border-radius:4px;border:1.5px solid var(--cream-dark);font-family:'Nunito',sans-serif;font-size:0.82rem;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 1.2rem;flex-wrap:wrap;gap:0.8rem;}
  .table-wrap{max-width:1100px;margin:0 auto;overflow-x:auto;}
  .msg{text-align:center;color:var(--text-soft);padding:2rem;}
</style>
</head>
<body>

<div id="loginBox" class="login-box">
  <h1 style="font-size:1.4rem;">🔒 Admin Login</h1>
  <input type="password" id="passcodeInput" placeholder="Enter passcode" onkeydown="if(event.key==='Enter')login()"/>
  <br/>
  <button onclick="login()">Login</button>
  <p id="loginError" style="color:#c0392b;font-size:0.8rem;margin-top:0.8rem;"></p>
</div>

<div id="dashboard" style="display:none;">
  <h1>📦 Orders Dashboard</h1>
  <div class="top-bar">
    <span id="orderCount" style="font-weight:700;color:var(--text-soft);"></span>
    <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh</button>
  </div>
  <div class="table-wrap">
    <table id="ordersTable" style="display:none;">
      <thead>
        <tr>
          <th>Order ID</th><th>Date</th><th>Customer</th><th>Phone</th><th>Email</th>
          <th>Address</th><th>Items</th><th>Total</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
    <p id="ordersMsg" class="msg"></p>
  </div>
</div>

<script>
let passcode = '';

function login() {
  const input = document.getElementById('passcodeInput').value.trim();
  if (!input) return;
  passcode = input;
  loadOrders();
}

async function loadOrders() {
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  document.getElementById('ordersMsg').textContent = 'Loading orders…';
  try {
    const res = await fetch('/api/admin-orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passcode })
    });
    const data = await res.json();
    if (res.status === 401) {
      errEl.textContent = 'Incorrect passcode.';
      passcode = '';
      return;
    }
    if (!res.ok) {
      document.getElementById('ordersMsg').textContent = 'Could not load orders: ' + (data.error || 'unknown error');
      return;
    }
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderOrders(data.orders || []);
  } catch (e) {
    document.getElementById('ordersMsg').textContent = 'Something went wrong loading orders.';
  }
}

function renderOrders(orders) {
  const body = document.getElementById('ordersBody');
  const table = document.getElementById('ordersTable');
  const msg = document.getElementById('ordersMsg');
  document.getElementById('orderCount').textContent = orders.length + ' order' + (orders.length !== 1 ? 's' : '');

  if (orders.length === 0) {
    table.style.display = 'none';
    msg.textContent = 'No orders yet.';
    return;
  }
  table.style.display = 'table';
  msg.textContent = '';

  body.innerHTML = orders.map(o => `
    <tr>
      <td>${o.order_id}</td>
      <td>${o.created_at ? new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—'}</td>
      <td>${escHtml(o.customer_name || '')}</td>
      <td>${escHtml(o.customer_phone || '')}</td>
      <td>${escHtml(o.customer_email || '')}</td>
      <td style="max-width:180px;">${escHtml(o.address || '')}, ${escHtml(o.state || '')} - ${escHtml(o.pincode || '')}</td>
      <td>${escHtml(o.items || '')}</td>
      <td>₹${o.total}</td>
      <td>
        <select onchange="updateStatus('${o.order_id}', this.value)">
          ${['paid','processing','shipped','delivered','cancelled'].map(s =>
            `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`
          ).join('')}
        </select>
      </td>
    </tr>`).join('');
}

async function updateStatus(orderId, status) {
  try {
    const res = await fetch('/api/admin-update-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId, status, passcode })
    });
    if (!res.ok) {
      alert('Could not update status. Please try again.');
      loadOrders();
      return;
    }
  } catch (e) {
    alert('Something went wrong updating status.');
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
